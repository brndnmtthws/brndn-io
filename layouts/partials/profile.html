{{ $author := site.Language.Params.Author }}
<header class="not-prose">
  <h1 class="text-4xl font-extrabold lg:text-5xl">
    {{ $author.name | default site.Title }}
  </h1>
  {{ with $author.headline }}
    <p
      class="mt-4 text-balance font-libre-baskerville text-2xl leading-snug text-stone-700 lg:text-3xl lg:leading-snug dark:text-stone-300"
    >
      {{ . | markdownify | emojify }}
    </p>
  {{ end }}
  {{ with $author.bio }}
    <p class="mt-4 text-neutral-500 dark:text-neutral-400">
      {{ . | markdownify | emojify }}
    </p>
  {{ end }}
  <div class="mt-5 flex items-center gap-x-4">
    <a
      class="font-semibold decoration-darkly-500 hover:underline hover:decoration-2 hover:underline-offset-2"
      href="{{ "about" | relLangURL }}"
    >
      About me &rarr;
    </a>
    <div class="text-2xl">
      {{ partialCached "author-links.html" . }}
    </div>
  </div>
</header>
