{{ with site.Taxonomies.tags }}
  <section>
    <h2 class="section-label">Topics</h2>
    <div class="mt-4 flex flex-wrap gap-2 text-sm">
      {{ range first 12 .ByCount }}
        {{ partial "tag-chip.html" (dict "term" .Page "count" .Count) }}
      {{ end }}
    </div>
    <div class="mt-4">
      <a
        class="font-semibold decoration-darkly-500 hover:underline hover:decoration-2 hover:underline-offset-2"
        href="{{ "tags" | relLangURL }}"
      >
        All tags &rarr;
      </a>
    </div>
  </section>
{{ end }}
