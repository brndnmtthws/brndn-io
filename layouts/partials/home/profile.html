{{ partial "profile.html" . }}
{{ with .Content }}
  <section class="prose prose-stone mt-6 dark:prose-invert">
    {{ . | emojify }}
  </section>
{{ end }}
<hr class="my-10 border-darkly-200 dark:border-darkly-800" />
{{/* Posts share the article column; the wayfinding lists take the column that holds the TOC on article pages. */}}
<div
  class="grid gap-x-16 gap-y-10 xl:grid-cols-[minmax(0,38rem)_minmax(0,1fr)]"
>
  <section>
    {{ partial "recent-articles.html" . }}
  </section>
  <aside class="grid content-start gap-10 sm:grid-cols-2 xl:grid-cols-1">
    {{ partial "start-here.html" . }}
    {{ partial "topics.html" . }}
  </aside>
</div>
