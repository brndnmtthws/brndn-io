# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

autoSwitchAppearance = true
colorScheme = "blark"
defaultAppearance = "light" # valid options: light or dark

enableCodeCopy = true
enableSearch = true

# Share image for link previews of pages that have no image of their own.
images = ["og-image.jpg"]

# mainSections = ["section1", "section2"]
# robots = ""

[header]
layout = "page" # valid options: basic, hamburger, custom

[footer]
showAppearanceSwitcher = true
showCopyright = true
showScrollToTop = true
showThemeAttribution = false

[homepage]
layout = "profile" # valid options: page, profile, custom
showRecent = true
# Curated posts listed under "Start here" on the homepage, in display order.
startHere = [
  { page = "/posts/the-value-of-tools", description = "Tools, leverage, and value creation" },
  { page = "/posts/growth-vs-grind", description = "Sustainable ambition" },
  { page = "/posts/the-10x-engineer-is-a-myth-its-more-like-100x", description = "Power laws in software and teams" },
  { page = "/posts/cities-are-technology", description = "Urbanism, infrastructure, and the car-shaped problem" },
  { page = "/posts/analogue-joy", description = "Film, physical media, and digital minimalism" },
]

[article]
showAuthor = true
showBreadcrumbs = false
showDate = true
showDateUpdated = false
showDraftLabel = true
showEdit = false
# editURL = "https://github.com/username/repo/"
editAppendPath = true
invertPagination = false
# sharingLinks = ["email", "facebook", "linkedin", "reddit", "twitter"]
showComments = false
showHeadingAnchors = true
showPagination = true
showReadingTime = true
showTableOfContents = true
showTaxonomies = false
showWordCount = false

[list]
groupByYear = true
showBreadcrumbs = false
showSummary = true
showTableOfContents = false

[sitemap]
excludedKinds = ["taxonomy", "term"]

[taxonomy]
showTermCount = true

[fathomAnalytics]
# site = "ABC12345"
# domain = "llama.yoursite.com"

[verification]
